name: Dex data check

on:
  pull_request:
    paths: ["assets/dexes/**", "assets/jsons/**", "scripts/dex.js"]
  push:
    branches: [main]
    paths: ["assets/dexes/**", "assets/jsons/**", "scripts/dex.js"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dex:check